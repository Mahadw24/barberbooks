<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="./favicon.png" />
    <title>Tresso</title>
    <!-- A browser too old for the dashboard (before Chrome 91, 2021) fails while
         loading it: say so instead of leaving a blank page. main.tsx sets
         __bbStarted once it runs. -->
    <script>
      window.onerror = function () {
        if (window.__bbStarted) return;
        document.body.innerHTML =
          '<p style="font:16px/1.5 sans-serif;max-width:420px;margin:48px auto;padding:0 16px">' +
          'This browser is too old for Tresso on the web. Update Chrome, or use the Tresso app for Android.<br><br>' +
          'Tresso ویب کے لیے یہ براؤزر بہت پرانا ہے۔ Chrome اپ ڈیٹ کریں، یا Android کے لیے Tresso ایپ استعمال کریں۔</p>';
      };
    </script>
    <script type="module" crossorigin src="./assets/index-seQqOEuZ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CWBjWexk.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
